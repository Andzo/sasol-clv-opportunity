[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sasol-clv-opportunity"
version = "1.0.0"
description = "Customer Lifetime Value & Opportunity Prediction system for Sasol forecourt stations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "catboost>=1.2",
    "lightgbm>=4.0",
    "numpy>=1.26",
    "optuna>=3.5",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "torch>=2.1",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
sasol-clv = "src.main:main"
sasol-labels = "src.label_rules:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["label_config.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
